<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply persisted theme before paint so we don't flash dark→light.
      (function () {
        try {
          var t = localStorage.getItem("mts-activist-theme");
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) { /* localStorage unavailable */ }
      })();
    </script>

    <title>Mismanagement</title>
    <meta
      name="description"
      content="An activist-style screen over public US companies, built from SEC filings every issuer is already required to publish. Browse compensation, board structure, ownership, insider activity, and 13D filings — let the numbers do the characterizing."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MTS Activist" />
    <meta property="og:title" content="MTS Activist — Public-company governance, in numbers" />
    <meta
      property="og:description"
      content="An activist-style screen over public US companies, built from SEC filings every issuer is already required to publish."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mtslive" />
    <meta name="twitter:title" content="MTS Activist — Public-company governance, in numbers" />
    <meta name="twitter:description" content="An activist-style screen over public US companies, built from SEC filings every issuer is already required to publish." />
    <meta name="twitter:image" content="/og.png" />

    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="author" content="MTS" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
